<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>すいすい矢印 | SVGエディタ</title>
<style>
:root{--ink:#493313;--muted:#887b65;--green:#ffa90e;--line:#e8dfcf;--paper:#faf7ef}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI","Yu Gothic UI",Meiryo,sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,[role=slider]:focus-visible{outline:3px solid #df9d47;outline-offset:4px}header{max-width:1440px;margin:auto;padding:25px 42px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:750}.logo{background:var(--green);color:var(--ink);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;font-size:26px}.tag{font-size:11px;letter-spacing:2px;color:var(--muted)}main{max-width:1440px;margin:auto;padding:35px 42px 24px}.intro{display:flex;align-items:end;justify-content:space-between;margin-bottom:28px}h1{font-size:30px;letter-spacing:.02em;margin:0 0 10px;font-weight:650}.intro p{margin:0;color:var(--muted);line-height:1.8}.step{font-size:12px;color:var(--muted)}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 304px;gap:22px}.canvas-card,.panel{border:1px solid var(--line);background:#fff;border-radius:18px;overflow:hidden}.canvas-toolbar{display:flex;justify-content:space-between;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line)}.tiny{font-size:11px;letter-spacing:.12em;color:var(--muted)}.tools{display:flex;gap:12px;align-items:center}.quiet{border:0;background:transparent;color:var(--muted);padding:5px}.quiet:hover{color:var(--green)}.stage{position:relative;background-color:#fffdf7;background-image:radial-gradient(#ded4bd .8px,transparent .8px);background-size:20px 20px}.stage.clean{background-image:none}.stage svg{width:100%;height:auto;display:block;touch-action:none;user-select:none}.handle{cursor:grab;touch-action:none}.handle:active{cursor:grabbing}.handle .hit{fill:transparent}.handle text{font-size:13px;font-weight:650;paint-order:stroke;stroke:#fffdf7;stroke-width:5;stroke-linejoin:round;fill:#8a5200}.hint{position:absolute;bottom:17px;left:20px;color:var(--muted);font-size:12px;pointer-events:none}.canvas-footer{border-top:1px solid var(--line);padding:16px 20px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.legend{display:flex;gap:16px}.dot{display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:6px}.dot.hollow{background:white;border:1px solid var(--green)}.panel{padding:23px}.section-label{font-size:11px;letter-spacing:.14em;color:var(--muted);margin:0 0 14px}.segmented{display:flex;background:#f7efdf;padding:4px;border-radius:10px;margin-bottom:25px}.segmented button{flex:1;border:0;border-radius:7px;background:transparent;padding:10px;color:var(--muted)}.segmented button.active{background:white;color:#8a5200;box-shadow:0 1px 5px #49331314}.field{margin:23px 0}.field>label,.field .row{display:flex;justify-content:space-between;margin-bottom:13px}.value{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--green);cursor:pointer}select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}.color-row{display:flex;align-items:center;gap:8px}.swatch{height:25px;width:25px;border:3px solid white;border-radius:50%;box-shadow:0 0 0 1px var(--line);padding:0}.swatch.selected{box-shadow:0 0 0 2px var(--green)}input[type=color]{border:0;width:30px;height:30px;padding:0;background:white;cursor:pointer}.hex{width:95px;min-width:0;border:1px solid var(--line);border-radius:7px;padding:8px;color:var(--ink);font-family:monospace}.divider{height:1px;background:var(--line);margin:24px 0}.primary,.secondary{width:100%;padding:12px;border:1px solid var(--green);border-radius:9px;font-weight:600}.primary{background:var(--green);color:var(--ink)}.primary:hover{background:#e89700}.secondary{background:white;color:#8a5200;margin-top:9px}.export-note{font-size:11px;text-align:center;color:var(--muted);margin:12px 0 0}.presets{margin-top:25px}.preset-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.preset-top p{margin:0}.preset-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.preset{background:#fff;border:1px solid var(--line);border-radius:12px;text-align:left;padding:8px 13px;color:var(--muted);font-size:11px}.preset:hover{border-color:var(--green);background:#fff4d9}.preset svg{width:100%;height:57px}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:23px;color:var(--muted);font-size:11px}details{margin-top:18px}summary{cursor:pointer;color:var(--muted);font-size:12px}textarea{margin-top:12px;width:100%;height:120px;font:11px/1.5 monospace;border:1px solid var(--line);border-radius:8px;padding:12px;resize:vertical}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);border-radius:10px;background:var(--ink);color:white;padding:13px 22px;box-shadow:0 5px 25px #49331326;z-index:5}.toast:empty{display:none}.disabled{opacity:.4}button:disabled{cursor:default}.guide-label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}@media(min-width:1400px){.stage svg{max-height:520px}}@media(max-width:900px){header{padding:20px}main{padding:26px 20px}.workspace{grid-template-columns:minmax(0,1fr) 265px;gap:14px}.panel{padding:18px}.step{display:none}.color-row{gap:5px}.swatch{width:20px;height:20px}.hex{width:85px}}@media(max-width:700px){.workspace{grid-template-columns:1fr}h1{font-size:25px}.intro{margin-bottom:20px}.tag{display:none}.panel{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}.panel>div:first-child,.panel>.actions{grid-column:1/-1}.panel .divider{display:none}.field{margin:13px 0}.segmented{margin-bottom:8px}.actions{margin-top:18px}.preset-grid{grid-template-columns:repeat(2,1fr)}.canvas-footer{font-size:10px;padding:13px}.legend{gap:8px}.hint{font-size:10px;bottom:9px}.bottom{gap:15px;align-items:start}.canvas-toolbar{padding:12px}.tools{gap:5px}.guide-label{font-size:11px}}
</style>
<header><div class="brand"><span class="logo">⤴</span>すいすい矢印</div><span class="tag">小さなかたち、大きなニュアンス。</span></header>
<main><div class="intro"><div><h1>思いどおりの、ひと曲がり。</h1><p>3つの点を動かして、あなただけの矢印を。<br>始点は点、終点は太く。そのままSVGに。</p></div><span class="step">01 点を動かす　 /　 02 かたちを整える　 /　 03 書き出す</span></div>
<div class="workspace"><div><section class="canvas-card" aria-label="矢印の編集"><div class="canvas-toolbar"><span class="tiny">プレビュー</span><div class="tools"><label class="guide-label"><input id="guides" type="checkbox" checked>ガイド</label><button class="quiet" id="reverse">↔ 反転</button><button class="quiet" id="reset">↺ リセット</button></div></div><div class="stage" id="stage"><svg id="editor" viewBox="0 0 800 480" aria-label="P0 始点、P1 制御点、P2 終点をドラッグして編集"><g id="art"></g><g id="guideLayer"><path id="guidePath" fill="none" stroke="#c5b28a" stroke-dasharray="5 7" stroke-width="1.2"/><path id="centerPath" fill="none" stroke="#bca06b" stroke-dasharray="2 5" opacity=".45"/><g id="handles"></g></g></svg><div class="hint" id="hint">点をドラッグして曲線を編集 · 選択後は矢印キーでも移動できます</div></div><div class="canvas-footer"><div class="legend"><span><i class="dot"></i>P0 始点</span><span><i class="dot hollow"></i>P1 制御点</span><span><i class="dot"></i>P2 終点</span></div><span>2次ベジェ · 3点</span></div></section><section class="presets" aria-label="プリセット"><div class="preset-top"><p class="section-label">かたちのヒント</p><span class="value">クリックして試す</span></div><div class="preset-grid" id="presets"></div></section><details><summary>SVGコードを表示</summary><textarea id="code" readonly aria-label="書き出し用SVGコード" spellcheck="false"></textarea></details></div>
<aside class="panel" aria-label="矢印の設定"><div><p class="section-label">かたちを整える</p><div class="segmented" aria-label="先端のタイプ"><button id="arrowMode" class="active" aria-pressed="true">↗ 矢印</button><button id="ribbonMode" aria-pressed="false">筆形</button><button id="dropMode" aria-pressed="false">しずく</button></div></div><div class="field"><label for="width">太さ<span id="widthValue" class="value"></span></label><input id="width" type="range" min="2" max="80" value="45"></div><div class="field"><label for="profile">先細りのかたち</label><select id="profile"><option value="soft">なめらか</option><option value="brush">筆のように</option><option value="leaf">ふっくら</option></select></div><div class="field"><label for="taper">先細りの強さ<span id="taperValue" class="value"></span></label><input id="taper" type="range" min="35" max="250" value="100"></div><div class="field" id="headField"><label for="head">矢じりの大きさ<span id="headValue" class="value"></span></label><input id="head" type="range" min="12" max="100" value="96"></div><div class="field"><label for="color">色</label><div class="color-row"><button class="swatch" style="background:#ffa90e" data-color="#ffa90e" aria-label="オレンジ"></button><button class="swatch" style="background:#253e51" data-color="#253e51" aria-label="紺色"></button><button class="swatch" style="background:#d16c4f" data-color="#d16c4f" aria-label="朱色"></button><input id="color" type="color" value="#ffa90e" aria-label="自由に色を選ぶ"><input id="hex" class="hex" value="#ffa90e" maxlength="7" aria-label="色コード" pattern="#[0-9a-fA-F]{6}"></div></div><div class="actions"><div class="divider"></div><button id="copy" class="primary">SVGをコピー <span aria-hidden="true">↗</span></button><button id="download" class="secondary">SVGをダウンロード ↓</button><p class="export-note">背景は透明・ガイドは含みません</p></div></aside></div><footer class="bottom"><span>点をつなぐだけで、伝わるかたちに。</span><span>端末内で動作 · 編集内容は自動保存</span></footer></main><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const initial=()=>({points:[{x:140,y:353},{x:220.841302,y:75.432749},{x:666,y:211}],mode:'arrow',width:45,head:96,taper:100,profile:'soft',color:'#ffa90e'});
let state=initial();try{const s=JSON.parse(localStorage.getItem('suisui-v2-amber'));if(s&&s.points?.length===3&&s.points.every(p=>Number.isFinite(p.x)&&Number.isFinite(p.y))&&['arrow','ribbon','drop'].includes(s.mode)&&['soft','brush','leaf'].includes(s.profile)&&/^#[0-9a-f]{6}$/i.test(s.color)&&['width','head','taper'].every(k=>Number.isFinite(s[k]))){state={...state,...s};state.points=state.points.map(p=>({x:Math.max(25,Math.min(775,p.x)),y:Math.max(35,Math.min(445,p.y))}));state.width=Math.max(2,Math.min(80,state.width));state.head=Math.max(12,Math.min(100,state.head));state.taper=Math.max(35,Math.min(250,state.taper))}}catch{}
const presets=[{name:'ゆるやかなカーブ',points:[{x:140,y:353},{x:365,y:65},{x:666,y:211}],profile:'soft',mode:'arrow',width:24},{name:'すっと、まっすぐ',points:[{x:140,y:310},{x:400,y:240},{x:670,y:170}],profile:'soft',mode:'arrow',width:18},{name:'大きく、ひと回り',points:[{x:140,y:350},{x:110,y:40},{x:680,y:240}],profile:'brush',mode:'arrow',width:28},{name:'やわらかなしずく',points:[{x:125,y:320},{x:430,y:90},{x:680,y:280}],profile:'leaf',mode:'drop',width:40}];
function curve(p,t){const u=1-t;return{x:u*u*p[0].x+2*u*t*p[1].x+t*t*p[2].x,y:u*u*p[0].y+2*u*t*p[1].y+t*t*p[2].y}}
function normal(p,t){let x=2*((1-t)*(p[1].x-p[0].x)+t*(p[2].x-p[1].x)),y=2*((1-t)*(p[1].y-p[0].y)+t*(p[2].y-p[1].y));if(Math.hypot(x,y)<1e-7){const a=curve(p,Math.max(0,t-.001)),b=curve(p,Math.min(1,t+.001));x=b.x-a.x;y=b.y-a.y}const l=Math.hypot(x,y);return l>1e-7?{x:-y/l,y:x/l}:{x:0,y:1}}
const fmt=n=>Number(n.toFixed(3));
function geometry(s){const p=s.points, samples=240;let length=0,prev=curve(p,0);const arc=[0];for(let i=1;i<=samples;i++){const q=curve(p,i/samples);length+=Math.hypot(q.x-prev.x,q.y-prev.y);arc.push(length);prev=q}let end=1,headPoints=[];if(s.mode==='arrow'&&length>1e-5){const h=Math.min(s.head,length*.4),target=length-h;let i=arc.findIndex(v=>v>=target);i=Math.max(1,i);const f=(target-arc[i-1])/(arc[i]-arc[i-1]||1);end=(i-1+f)/samples;const b=curve(p,end),tip=p[2];let dx=tip.x-b.x,dy=tip.y-b.y,l=Math.hypot(dx,dy);const n=l>1e-6?{x:-dy/l,y:dx/l}:normal(p,1);const w=h*.53;headPoints=[{x:b.x+n.x*w,y:b.y+n.y*w},tip,{x:b.x-n.x*w,y:b.y-n.y*w}]}
const left=[],right=[];for(let i=0;i<=samples;i++){const u=i/samples,t=u*end,q=curve(p,t),n=normal(p,t);const v=s.mode!=='drop'?u*.5:u;let base;if(s.profile==='brush')base=Math.pow(v,.55)*Math.pow(1-v,1.5)/.305;else if(s.profile==='leaf')base=Math.pow(Math.sin(Math.PI*v),.55);else base=Math.sin(Math.PI*v);let width=s.width*.5*Math.pow(Math.max(0,base),s.taper/100);if(s.mode!=='drop')width=Math.max(width,s.width*.5*Math.pow(u,2));if(i===0||s.mode==='drop'&&i===samples)width=0;left.push({x:q.x+n.x*width,y:q.y+n.y*width});right.push({x:q.x-n.x*width,y:q.y-n.y*width})}const outline=[...left,...headPoints,...right.reverse()];const d=outline.map((q,i)=>(i?'L':'M')+fmt(q.x)+' '+fmt(q.y)).join(' ')+' Z';let minX=Math.min(...outline.map(q=>q.x)),maxX=Math.max(...outline.map(q=>q.x)),minY=Math.min(...outline.map(q=>q.y)),maxY=Math.max(...outline.map(q=>q.y));return{d,box:[fmt(minX-8),fmt(minY-8),fmt(Math.max(1,maxX-minX)+16),fmt(Math.max(1,maxY-minY)+16)]}}
function exported(){const g=geometry(state);return '<svg xmlns="'+NS+'" viewBox="'+g.box.join(' ')+'" width="'+Math.ceil(g.box[2])+'" height="'+Math.ceil(g.box[3])+'">\n  <path fill="'+state.color+'" d="'+g.d+'"/>\n</svg>'}
let saveTimer;function render(){const g=geometry(state);$('art').innerHTML='<path fill="'+state.color+'" d="'+g.d+'"/>';$('guidePath').setAttribute('d',state.points.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' '));$('centerPath').setAttribute('d',`M${state.points[0].x} ${state.points[0].y} Q${state.points[1].x} ${state.points[1].y} ${state.points[2].x} ${state.points[2].y}`);state.points.forEach((p,i)=>{const el=$('point'+i);el.setAttribute('transform',`translate(${p.x},${p.y})`);el.setAttribute('aria-valuetext',`x ${Math.round(p.x)}、y ${Math.round(p.y)}`)});for(const k of ['width','head','taper','profile','color'])$(k).value=state[k];$('hex').value=state.color;$('widthValue').textContent=state.width+' px';$('headValue').textContent=state.head+' px';$('taperValue').textContent=(state.taper/100).toFixed(2)+' ×';for(const m of ['arrow','ribbon','drop']){$(m+'Mode').classList.toggle('active',state.mode===m);$(m+'Mode').setAttribute('aria-pressed',state.mode===m)}$('head').disabled=state.mode!=='arrow';$('headField').classList.toggle('disabled',state.mode!=='arrow');document.querySelectorAll('[data-color]').forEach(b=>b.classList.toggle('selected',b.dataset.color===state.color));$('code').value=exported();clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem('suisui-v2-amber',JSON.stringify(state))}catch{}},150)}
let drag=null;['始点','制御点','終点'].forEach((name,i)=>{const el=document.createElementNS(NS,'g');el.id='point'+i;el.classList.add('handle');el.setAttribute('tabindex','0');el.setAttribute('role','slider');el.setAttribute('aria-label',`P${i} ${name}。矢印キーで移動、Shiftで10ずつ移動`);el.innerHTML='<circle class="hit" r="24"/><circle r="'+(i===1?8:7)+'" fill="'+(i===1?'white':'#ffa90e')+'" stroke="'+(i===1?'#ffa90e':'white')+'" stroke-width="2.5"/><text x="14" y="-15">P'+i+' '+name+'</text>';$('handles').append(el);el.addEventListener('pointerdown',e=>{e.preventDefault();el.focus();drag={i,id:e.pointerId};el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId||drag.i!==i)return;const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform($('editor').getScreenCTM().inverse());state.points[i]={x:Math.max(25,Math.min(775,pt.x)),y:Math.max(35,Math.min(445,pt.y))};render()});for(const event of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(event,()=>{drag=null});el.addEventListener('keydown',e=>{const delta={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(!delta)return;e.preventDefault();const step=e.shiftKey?10:1,p=state.points[i];p.x=Math.max(25,Math.min(775,p.x+delta[0]*step));p.y=Math.max(35,Math.min(445,p.y+delta[1]*step));render()})});
for(const k of ['width','head','taper','profile','color'])$(k).addEventListener('input',()=>{state[k]=['width','head','taper'].includes(k)?Number($(k).value):$(k).value;render()});$('hex').addEventListener('input',()=>{if(/^#[0-9a-f]{6}$/i.test($('hex').value)){state.color=$('hex').value;render()}});$('hex').addEventListener('blur',()=>{$('hex').value=state.color});document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{state.color=b.dataset.color;render()});for(const m of ['arrow','ribbon','drop'])$(m+'Mode').onclick=()=>{state.mode=m;render()};$('reverse').onclick=()=>{state.points.reverse();render()};$('reset').onclick=()=>{state=initial();render();notify('最初のかたちに戻しました')};$('guides').onchange=()=>{const on=$('guides').checked;$('guideLayer').style.display=on?'':'none';$('hint').style.display=on?'':'none';$('stage').classList.toggle('clean',!on)};
presets.forEach((p,i)=>{const b=document.createElement('button');b.className='preset';const g=geometry({...initial(),...p});b.innerHTML='<svg viewBox="80 40 650 380" aria-hidden="true"><path d="'+g.d+'" fill="#ffa90e"/></svg><span>0'+(i+1)+'　'+p.name+'</span>';b.onclick=()=>{state={...state,...p,points:p.points.map(q=>({...q}))};render()};$('presets').append(b)});
let toastTimer;function notify(t){$('toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',3000)}
$('copy').onclick=async()=>{const text=exported();let ok=false;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);ok=true}}catch{}if(!ok){const t=document.createElement('textarea');t.value=text;t.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(t);t.select();try{ok=document.execCommand('copy')}catch{}t.remove()}if(ok)notify('SVGをコピーしました');else{document.querySelector('details').open=true;$('code').focus();$('code').select();notify('コードを選択しました。Ctrl+Cでコピーしてください')}};
$('download').onclick=()=>{const url=URL.createObjectURL(new Blob([exported()],{type:'image/svg+xml;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='suisui-arrow.svg';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('SVGをダウンロードしました')};
render();window.addEventListener('pagehide',()=>{try{localStorage.setItem('suisui-v2-amber',JSON.stringify(state))}catch{}});
})();
</script></html>
